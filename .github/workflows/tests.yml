# Runs the same two commands the README tells you to run, on every push.
# The point of this file is that "tested" should not be something you take
# our word for: the badge is green because GitHub just ran the suite, on a
# clean machine, across the interpreters and platforms the hooks claim to
# support.
#
# There is deliberately no dependency install step. The hooks are Python 3
# stdlib only, so a bare checkout plus an interpreter is the whole setup.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so interpreter and runner-image drift surfaces here rather than
  # in someone's session.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # setup-python publishes no arm64 macOS build below 3.11, and
          # macos-latest is arm64. The 3.9 floor is covered on Linux.
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Hook cases
        run: python3 harness/run.py
      - name: Installer
        run: python3 harness/test_install.py
